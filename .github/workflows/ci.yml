name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r dbt/requirements.txt
      # parse needs no database; the env vars only have to exist
      - run: dbt parse --project-dir dbt --profiles-dir dbt
        env:
          PG_HOST: localhost
          PG_USER: ci
          PG_PASSWORD: ci

  # TODO(DE1, D4-D5): terraform fmt/validate/plan with azure/login (OIDC, no client secret),
  # then on main: build images to ghcr.io and terraform apply.
