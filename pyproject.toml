[project]
name = "flowcast"
version = "0.1.0"
description = "Flowcast (Smart Traffic & Weather Hub): 15-minute traffic and weather events on Google Cloud"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dataform", "infra", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["collector/tests"]
pythonpath = ["collector/src"]
addopts = "-q"
