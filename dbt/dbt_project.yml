name: flowcast
version: "0.1.0"
config-version: 2
profile: flowcast

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: [target, dbt_packages, logs]

# Shared constants (were dataform/includes/constants.js). Use as {{ var('local_tz') }}.
vars:
  local_tz: "Africa/Cairo"
  # First collected slot (UTC). Set on D1 after the first successful run.
  collection_start: "2026-01-01 00:00:00+00"
  # Congestion class thresholds on congestion_ratio. DA1 owns these (D2).
  class_threshold_low: 0.75
  class_threshold_medium: 0.5

models:
  flowcast:
    silver:
      +schema: silver
      +materialized: incremental
    gold:
      +schema: gold
      +materialized: table

tests:
  flowcast:
    +schema: assertions
